version: 2

models:

  - name: stg_customers

    columns:

      - name: customer_id
        tests:
          - unique
          - not_null

      - name: email
        tests:
          - unique
          - not_null

  - name: stg_products

    columns:

      - name: product_id
        tests:
          - unique
          - not_null

      - name: price
        tests:
          - not_null

  - name: stg_orders

    columns:

      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id

      - name: quantity
        tests:
          - not_null
